name: Build Python + OpenSSL

# Single source of truth for compiling OpenSSL + Python from source.
# All other workflows consume these via actions/cache/restore.
#
# Cache key strategy:
#   Save key:    python-ssl-{os}-{arch}-v2-{YYYYMMDD}
#   Restore key: python-ssl-{os}-{arch}-v2-   (prefix match → latest successful)
#   Force rebuild: bump v2 → v3

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHE_VERSION: v2
  OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl
  OPENSSL_SOURCE_PATH: ${{ github.workspace }}/src/openssl
  PYTHON_INSTALL_PATH: ${{ github.workspace }}/bin/python
  PYTHON_SOURCE_PATH: ${{ github.workspace }}/src/cpython
  OPENSSL_CONFIG_OPTS: no-fips --api=3.0.0 no-docs no-tls1 no-tls1_1 no-dtls no-comp no-srp no-psk no-nextprotoneg no-weak-ssl-ciphers no-idea no-seed no-camellia no-sm2 no-sm3 no-sm4 no-rc2 no-rc4 no-rc5 no-md2 no-md4 no-cast no-shared -fPIC no-tests -O3

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
          - os: macos-15
            name: macOS ARM64
          - os: windows-2025
            name: Windows x64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Check if today's cache already exists ──
      - name: "Cache: check for today's build"
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            python-ssl-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_VERSION }}-

      # ── Skip everything if cache is already warm from today ──
      # All subsequent steps are conditioned on cache miss.

      # ── Set build env vars (MAKE, PERL, MAKEOPT, CFLAGS, LDFLAGS per-OS) ──
      - name: "Set build env vars"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "Building on ${RUNNER_OS} / ${RUNNER_ARCH}"
          LD_LIBRARY_PATH="${OPENSSL_INSTALL_PATH}/lib:${PYTHON_INSTALL_PATH}/lib:/usr/local/lib"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export CFLAGS="-O3 -pipe"
            export LDFLAGS="-Wl,-dead_strip"
            MAKE=make; MAKEOPT="-j$(sysctl -n hw.logicalcpu)"; PERL=perl
          elif [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CFLAGS="-O3 -pipe"
            export LDFLAGS="-Wl,--strip-all"
            MAKE=make; MAKEOPT="-j$(nproc)"; PERL=perl
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            MAKE=nmake; MAKEOPT=""; PERL="c:\strawberry\perl\bin\perl.exe"
          fi
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "MAKE=${MAKE}" >> $GITHUB_ENV
          echo "MAKEOPT=${MAKEOPT}" >> $GITHUB_ENV
          echo "PERL=${PERL}" >> $GITHUB_ENV
          echo "CFLAGS=${CFLAGS}" >> $GITHUB_ENV
          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV

      # ── Windows: MSVC + NASM ──
      - name: "Windows: Configure MSVC"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch }}

      - name: "Windows: Install NASM"
        if: runner.os == 'Windows' && runner.arch == 'X64' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # ── Linux: build dependencies ──
      - name: "Linux: install build dependencies"
        if: runner.os == 'Linux' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential libffi-dev libsqlite3-dev zlib1g-dev \
            libbz2-dev libreadline-dev libncurses-dev liblzma-dev

      # ════════════════════════════════════════════════════════════════
      # OpenSSL
      # ════════════════════════════════════════════════════════════════

      - name: "Clone OpenSSL source"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -vp "${GITHUB_WORKSPACE}/src"
          cd "${GITHUB_WORKSPACE}/src"
          git clone https://github.com/openssl/openssl.git
          cd "${OPENSSL_SOURCE_PATH}"
          LATEST_STABLE_TAG=$(git tag --list openssl-* | grep -v alpha | grep -v beta | sort -Vr | head -n1)
          echo "Checking out OpenSSL ${LATEST_STABLE_TAG}"
          git checkout "${LATEST_STABLE_TAG}"
          echo "COMPILED_OPENSSL_VERSION=${LATEST_STABLE_TAG:8}" >> $GITHUB_ENV

      - name: "Windows: Rename GNU link"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: mv -v /usr/bin/link /usr/bin/gnulink

      - name: "Configure OpenSSL"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          # Linux ARM64 needs no-asm for OpenSSL 4.0 compatibility
          if ([ "$RUNNER_OS" == "Linux" ] && [ "$RUNNER_ARCH" == "ARM64" ]); then
            "${PERL}" ./Configure --libdir=lib --prefix="${OPENSSL_INSTALL_PATH}" no-asm $OPENSSL_CONFIG_OPTS
          else
            "${PERL}" ./Configure --libdir=lib --prefix="${OPENSSL_INSTALL_PATH}" $OPENSSL_CONFIG_OPTS
          fi

      - name: "Build OpenSSL"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          $MAKE $MAKEOPT

      - name: "Install OpenSSL"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${OPENSSL_SOURCE_PATH}"
          $MAKE install_sw
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            strip "${OPENSSL_INSTALL_PATH}/bin/openssl"
          fi

      - name: "Verify OpenSSL"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "${OPENSSL_INSTALL_PATH}/bin/openssl" version -a
          file "${OPENSSL_INSTALL_PATH}/bin/openssl"

      # ════════════════════════════════════════════════════════════════
      # Python (Linux / macOS)
      # ════════════════════════════════════════════════════════════════

      - name: "Clone Python source"
        if: steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/src"
          git clone https://github.com/python/cpython.git
          cd "${PYTHON_SOURCE_PATH}"
          LATEST_STABLE_TAG=$(git tag --list | grep -v a | grep -v rc | grep -v b | sort -Vr | head -n1)
          echo "Checking out Python ${LATEST_STABLE_TAG}"
          git checkout "${LATEST_STABLE_TAG}"
          # Temp Python 3.14 patch to work with OpenSSL 4
          # Python 3.15 in Oct 2026 should support 4 OOB
          patch -p1 < "${GITHUB_WORKSPACE}/tools/py314-ossl4.diff"
          echo "COMPILED_PYTHON_VERSION=${LATEST_STABLE_TAG:1}" >> $GITHUB_ENV

      - name: "Configure Python (Linux/macOS)"
        if: runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          ./configure --with-openssl="${OPENSSL_INSTALL_PATH}" \
                      --prefix="${PYTHON_INSTALL_PATH}" \
                      --enable-shared \
                      --with-ensurepip=upgrade \
                      --enable-optimizations \
                      --with-lto \
                      --disable-test-modules \
                      --without-doc-strings || : # exit 0
          cat config.log

      - name: "Build Python (Linux/macOS)"
        if: runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          echo "Running: ${MAKE} ${MAKEOPT}"
          $MAKE $MAKEOPT

      - name: "Install Python (Linux/macOS)"
        if: runner.os != 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "${PYTHON_SOURCE_PATH}"
          $MAKE altinstall
          $MAKE bininstall
          strip "${PYTHON_INSTALL_PATH}/bin/python3"

      # ════════════════════════════════════════════════════════════════
      # Python (Windows — PCbuild)
      # ════════════════════════════════════════════════════════════════

      - name: "Windows: Get CPython external deps"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          PCBuild\get_externals.bat

      - name: "Windows: Replace external OpenSSL with compiled"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          $env:OPENSSL_EXT_PATH = "$(Get-Item externals\openssl-bin-* | Select -exp FullName)\"
          echo "External OpenSSL was at ${env:OPENSSL_EXT_PATH}"
          Remove-Item -recurse -force "${env:OPENSSL_EXT_PATH}*"
          if (${env:RUNNER_ARCH} -eq "X64") {
            $env:ossl_path = "amd64"
          } elseif (${env:RUNNER_ARCH} -eq "ARM64") {
            $env:ossl_path = "arm64"
          }
          $env:OPENSSL_EXT_TARGET_PATH = "${env:OPENSSL_EXT_PATH}${env:ossl_path}"
          echo "Copying compiled OpenSSL to ${env:OPENSSL_EXT_TARGET_PATH}"
          mkdir "${env:OPENSSL_EXT_TARGET_PATH}\include\openssl\"
          Copy-Item -Path "${env:OPENSSL_SOURCE_PATH}\LICENSE.txt" -Destination "${env:OPENSSL_EXT_TARGET_PATH}\LICENSE"
          cp -v "$env:OPENSSL_INSTALL_PATH\lib\*" "${env:OPENSSL_EXT_TARGET_PATH}"
          cp -v "$env:OPENSSL_INSTALL_PATH\bin\*" "${env:OPENSSL_EXT_TARGET_PATH}"
          cp -v "$env:OPENSSL_INSTALL_PATH\include\openssl\*" "${env:OPENSSL_EXT_TARGET_PATH}\include\openssl\"
          cp -v "$env:OPENSSL_INSTALL_PATH\include\openssl\applink.c" "${env:OPENSSL_EXT_TARGET_PATH}\include\"

      - name: "Windows: Copy custom OpenSSL build props"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          # Custom openssl.props uses OpenSSL 3 DLL names
          Copy-Item -Path "${env:GITHUB_WORKSPACE}\tools\openssl.props" -Destination PCBuild\ -Verbose
          # Custom _hashlib.vcxproj for our OpenSSL build
          Copy-Item -Path "${env:GITHUB_WORKSPACE}\tools\_hashlib.vcxproj" -Destination PCBuild\ -Verbose

      - name: "Windows: Build + Install Python"
        if: runner.os == 'Windows' && steps.cache-python-ssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          cd "${env:PYTHON_SOURCE_PATH}"
          if (${env:RUNNER_ARCH} -eq "X64") {
            $env:arch = "x64"
          } elseif (${env:RUNNER_ARCH} -eq "ARM64") {
            $env:arch = "ARM64"
          }
          PCBuild\build.bat -c Release -p $env:arch --pgo
          $env:PS_PYTHON_INSTALL_PATH = (cygpath -w $env:PYTHON_INSTALL_PATH)
          .\python.bat PC\layout --precompile --preset-default --copy $env:PS_PYTHON_INSTALL_PATH

      # ════════════════════════════════════════════════════════════════
      # Verify
      # ════════════════════════════════════════════════════════════════

      - name: "Set PYTHON env var and library paths"
        shell: bash
        run: |
          # Set the exact path to our compiled Python binary.
          # On Windows, CPython installs as python.exe (no python3 symlink).
          # Using $PYTHON everywhere avoids picking up a system Python.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PYTHON="${PYTHON_INSTALL_PATH}/python.exe"
            echo "${PYTHON_INSTALL_PATH}" >> "$GITHUB_PATH"
            echo "${PYTHON_INSTALL_PATH}/Scripts" >> "$GITHUB_PATH"
          else
            export PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
            echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"
          fi

          # Library search paths — set for ALL OSes so our compiled OpenSSL
          # is always found before any system copy.
          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH}"
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Compiled Python binary: ${PYTHON}"
          ls -la "${PYTHON}" 2>/dev/null || echo "WARNING: ${PYTHON} does not exist!"
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"

      - name: "Verify compiled Python + OpenSSL"
        shell: bash
        run: |
          echo "══════════════════════════════════════════════════"
          echo "BUILD VERIFICATION"
          echo "══════════════════════════════════════════════════"

          echo ""
          echo "=== PYTHON env var ==="
          echo "PYTHON=${PYTHON}"
          ls -la "${PYTHON}" || echo "PYTHON binary NOT FOUND"
          echo ""
          echo "=== Python version ==="
          "${PYTHON}" --version
          echo ""
          echo "=== Python sys.executable ==="
          "${PYTHON}" -c "import sys; print(f'sys.executable: {sys.executable}')"
          echo ""
          echo "=== Which python3 is on PATH (for comparison) ==="
          which python3 2>/dev/null || echo "python3 not on PATH"
          which python 2>/dev/null || echo "python not on PATH"
          echo ""
          echo "=== OpenSSL (standalone binary) ==="
          "${OPENSSL_INSTALL_PATH}/bin/openssl" version -a
          echo ""
          echo "=== OpenSSL (via Python ssl module) ==="
          "${PYTHON}" -c "
          import ssl, sys
          print(f'Python version:       {sys.version}')
          print(f'Python executable:    {sys.executable}')
          print(f'ssl module file:      {ssl.__file__}')
          print(f'ssl.OPENSSL_VERSION:  {ssl.OPENSSL_VERSION}')
          print(f'ssl.OPENSSL_VERSION_INFO: {ssl.OPENSSL_VERSION_INFO}')
          try:
              import _ssl
              print(f'_ssl module file:     {_ssl.__file__}')
          except Exception as e:
              print(f'_ssl import error:    {e}')
          "
          echo ""
          echo "=== Version match check ==="
          STANDALONE_VER=$("${OPENSSL_INSTALL_PATH}/bin/openssl" version 2>/dev/null | awk '{print $2}')
          PYTHON_VER=$("${PYTHON}" -c "import ssl; print(ssl.OPENSSL_VERSION.split()[1])")
          echo "Standalone OpenSSL: ${STANDALONE_VER}"
          echo "Python ssl OpenSSL: ${PYTHON_VER}"
          if [[ "${STANDALONE_VER}" == "${PYTHON_VER}" ]]; then
            echo "✓ Versions MATCH"
          else
            echo "✗ VERSION MISMATCH! Python did not link against the compiled OpenSSL."
            echo "  This will cause ABI crashes when hardmTLS links against bin/ssl."
          fi
          echo ""
          echo "=== OpenSSL header version (what hardmTLS will compile against) ==="
          grep -E 'OPENSSL_VERSION_(TEXT|STR|MAJOR|MINOR|PATCH)' "${OPENSSL_INSTALL_PATH}/include/openssl/opensslv.h" 2>/dev/null | head -10 || echo "opensslv.h not found"
          echo ""
          echo "=== Libraries in bin/ssl/lib ==="
          ls -la "${OPENSSL_INSTALL_PATH}/lib/"libssl* "${OPENSSL_INSTALL_PATH}/lib/"libcrypto* 2>/dev/null || echo "No OpenSSL libs found"
          echo ""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "=== Windows: _ssl.pyd location ==="
            find "${PYTHON_INSTALL_PATH}" -name '_ssl*' 2>/dev/null || echo "_ssl not found"
            echo ""
            echo "=== Windows: OpenSSL DLLs in Python dir ==="
            find "${PYTHON_INSTALL_PATH}" -name 'libssl*' -o -name 'libcrypto*' 2>/dev/null || echo "No OpenSSL DLLs in Python dir"
            echo ""
            echo "=== Windows: All DLLs in Python dir ==="
            find "${PYTHON_INSTALL_PATH}" -maxdepth 1 -name '*.dll' 2>/dev/null || echo "No DLLs found"
          fi
          echo ""
          echo "=== Build info ==="
          echo "Cache key: python-ssl-${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_VERSION}-$(date +%Y%m%d)"
          echo "COMPILED_OPENSSL_VERSION: ${COMPILED_OPENSSL_VERSION:-not set}"
          echo "COMPILED_PYTHON_VERSION:  ${COMPILED_PYTHON_VERSION:-not set}"

      # Cache is automatically saved at end of job by actions/cache
