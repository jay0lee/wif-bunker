name: Update TPM Root CAs

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-roots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.x'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'

      - name: Install tpmtb
        run: go install github.com/loicsikidi/tpm-ca-certificates/cmd/tpmtb@latest

      - name: Install Python dependencies
        run: pip install cryptography

      - name: Run update script
        run: python scripts/update_tpm_roots.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to TPM root certificates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "TPM root certificates have been updated."
            git diff --stat
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: 'chore: update TPM EK root certificates'
          title: 'chore: update TPM EK root certificates'
          body: |
            Automated weekly update of TPM EK root and intermediate CA certificates
            from [tpm-ca-certificates](https://github.com/loicsikidi/tpm-ca-certificates).

            Bundle downloaded and verified via `tpmtb` (Sigstore + SLSA provenance).
          branch: chore/update-tpm-roots
          delete-branch: true
          labels: dependencies
