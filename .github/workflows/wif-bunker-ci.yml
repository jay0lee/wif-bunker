name: WIF Bunker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'

# ── Shared env for both jobs (pre-built Python + OpenSSL from cache) ──
env:
  OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl
  PYTHON_INSTALL_PATH: ${{ github.workspace }}/bin/python
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev libtss2-dev swig pkg-config

      - name: Restore compiled OpenSSL + Python
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-ubuntu-24.04-v2-
          restore-keys: |
            python-ssl-ubuntu-24.04-v2-
          fail-on-cache-miss: true

      - name: Set PYTHON env var and library paths
        run: |
          PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
          echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"

          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Using compiled Python: ${PYTHON}"
          "${PYTHON}" --version
          "${PYTHON}" -c "import ssl; print(f'OpenSSL: {ssl.OPENSSL_VERSION}')"

      - name: Create venv and install dependencies
        run: |
          "${PYTHON}" -m venv .venv
          source .venv/bin/activate
          VENV_BIN="$PWD/.venv/bin"
          echo "${VENV_BIN}" >> "$GITHUB_PATH"

          VENV_PYTHON="$(which python)"
          echo "PYTHON=${VENV_PYTHON}" >> $GITHUB_ENV
          export PYTHON="${VENV_PYTHON}"
          echo "PYTHON updated to venv: ${PYTHON}"

          # Belt-and-suspenders for GCC 15 / C23:  primary fix is the
          # tpm2-pytss pin to 3.0.0-rc1 in pyproject.toml; this CFLAGS
          # fallback keeps pycparser's CFFI build working regardless.
          export CFLAGS="-std=c11 ${CFLAGS:-}"

          pip install ruff pylint
          pip install .

      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pylint
        run: pylint wif_bunker/ --fail-under=9.0

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── System libs needed at runtime (Linux only) ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev libtss2-dev swig pkg-config

      # ══════════════════════════════════════════════════════════════════
      # Restore pre-built OpenSSL + Python from cache
      # Built daily by build-python-ssl.yml — restore-keys prefix match
      # falls back to the most recent successful build.
      # ══════════════════════════════════════════════════════════════════
      - name: Restore compiled OpenSSL + Python
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-${{ matrix.os }}-v2-
          restore-keys: |
            python-ssl-${{ matrix.os }}-v2-
          fail-on-cache-miss: true

      - name: Set PYTHON env var and library paths
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYTHON="${PYTHON_INSTALL_PATH}/python.exe"
            echo "${PYTHON_INSTALL_PATH}" >> "$GITHUB_PATH"
            echo "${PYTHON_INSTALL_PATH}/Scripts" >> "$GITHUB_PATH"
          else
            PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
            echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"
          fi

          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH}"
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Using compiled Python: ${PYTHON}"
          "${PYTHON}" --version
          "${PYTHON}" -c "import ssl; print(f'OpenSSL: {ssl.OPENSSL_VERSION}')"

      # ── Create venv and install (mirrors integration-test.yml) ──
      - name: Create venv and install dependencies
        run: |
          "${PYTHON}" -m venv .venv
          if [ -d ".venv/Scripts" ]; then
            source .venv/Scripts/activate
            VENV_BIN="$PWD/.venv/Scripts"
          else
            source .venv/bin/activate
            VENV_BIN="$PWD/.venv/bin"
          fi
          echo "${VENV_BIN}" >> "$GITHUB_PATH"

          VENV_PYTHON="$(which python)"
          echo "PYTHON=${VENV_PYTHON}" >> $GITHUB_ENV
          export PYTHON="${VENV_PYTHON}"
          echo "PYTHON updated to venv: ${PYTHON}"

          # Force C11 mode so pycparser (used by tpm2-pytss build) doesn't
          # choke on GCC 15's C23 headers (bool vs _Bool).
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CFLAGS="-std=c11 ${CFLAGS:-}"
          fi

          pip install pytest pytest-cov
          pip install .

      - name: Run tests
        run: pytest --cov --cov-report=term-missing
