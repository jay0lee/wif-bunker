name: WIF Bunker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'packaging/wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'packaging/wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'

# ── Shared env for both jobs (pre-built Python + OpenSSL from cache) ──
env:
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev libtss2-dev swig pkg-config

      - name: Set up latest Python and OpenSSL
        id: setup-python-ssl
        uses: jay0lee/python-openssl-latest@v1

      - name: Create venv and install dependencies
        run: |
          "${PYTHON}" -m venv .venv
          source .venv/bin/activate
          VENV_BIN="$PWD/.venv/bin"
          echo "${VENV_BIN}" >> "$GITHUB_PATH"

          VENV_PYTHON="$(which python)"
          echo "PYTHON=${VENV_PYTHON}" >> $GITHUB_ENV
          export PYTHON="${VENV_PYTHON}"
          echo "PYTHON updated to venv: ${PYTHON}"

          # Belt-and-suspenders for GCC 15 / C23:  primary fix is the
          # tpm2-pytss pin to 3.0.0-rc1 in pyproject.toml; this CFLAGS
          # fallback keeps pycparser's CFFI build working regardless.
          export CFLAGS="-std=c11 ${CFLAGS:-}"

          pip install ruff pylint
          pip install .

      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pylint
        run: pylint wif_bunker/ --fail-under=9.0

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── System libs needed at runtime (Linux only) ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev libtss2-dev swig pkg-config

      - name: Set up latest Python and OpenSSL
        id: setup-python-ssl
        uses: jay0lee/python-openssl-latest@v1

      # ── Create venv and install (mirrors integration-test.yml) ──
      - name: Create venv and install dependencies
        run: |
          "${PYTHON}" -m venv .venv
          if [ -d ".venv/Scripts" ]; then
            source .venv/Scripts/activate
            VENV_BIN="$PWD/.venv/Scripts"
          else
            source .venv/bin/activate
            VENV_BIN="$PWD/.venv/bin"
          fi
          echo "${VENV_BIN}" >> "$GITHUB_PATH"

          VENV_PYTHON="$(which python)"
          echo "PYTHON=${VENV_PYTHON}" >> $GITHUB_ENV
          export PYTHON="${VENV_PYTHON}"
          echo "PYTHON updated to venv: ${PYTHON}"

          # Force C11 mode so pycparser (used by tpm2-pytss build) doesn't
          # choke on GCC 15's C23 headers (bool vs _Bool).
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CFLAGS="-std=c11 ${CFLAGS:-}"
          fi

          pip install pytest pytest-cov
          pip install .

      - name: Run tests
        run: pytest --cov --cov-report=term-missing
