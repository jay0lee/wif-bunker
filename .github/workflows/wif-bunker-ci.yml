name: WIF Bunker CI

on:
  push:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'wif_bunker/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'wif-bunker.spec'
      - '.github/workflows/wif-bunker-ci.yml'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install system dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libtss2-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff pylint
      - run: python -m pip install --only-deps .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pylint
        run: pylint wif_bunker/ --fail-under=9.0

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libtss2-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pytest-cov
      - run: python -m pip install --only-deps .
      - name: Run tests
        run: pytest --cov --cov-report=term-missing
