name: hardmTLS CI

on:
  push:
    paths:
      - 'hardmtls-native/**'
      - '.github/workflows/hardmtls-ci.yml'
  pull_request:
    paths:
      - 'hardmtls-native/**'
      - '.github/workflows/hardmtls-ci.yml'

env:
  CARGO_TERM_COLOR: always
  # Path to pre-built OpenSSL (from build-python-ssl.yml cache)
  OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ── Restore pre-built OpenSSL from cache ──
      - name: "Restore compiled OpenSSL"
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: bin/ssl
          key: python-ssl-${{ runner.os }}-${{ runner.arch }}-v1-
          restore-keys: |
            python-ssl-${{ runner.os }}-${{ runner.arch }}-v1-
          fail-on-cache-miss: true

      - name: "Verify OpenSSL"
        shell: bash
        run: |
          "${OPENSSL_INSTALL_PATH}/bin/openssl" version -a

      # ── Windows: MSVC for cargo build ──
      - name: "Windows: Configure MSVC"
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch }}

      - name: "Windows: Hide Git link.exe (shadows MSVC)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          GIT_LINK="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$GIT_LINK" ]; then
            mv "$GIT_LINK" "${GIT_LINK}.bak"
            echo "Renamed Git link.exe to avoid MSVC collision"
          fi

      # ── Cargo checks ──
      - name: Formatting
        working-directory: hardmtls-native
        run: cargo fmt --all -- --check

      - name: Linting
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo test --all-features

      - name: Documentation
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo doc --no-deps

      - name: Build release
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo build --release

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: libhardmtls-${{ matrix.os }}
          path: |
            hardmtls-native/target/release/libhardmtls.dylib
            hardmtls-native/target/release/libhardmtls.so
            hardmtls-native/target/release/hardmtls.dll
          if-no-files-found: ignore
