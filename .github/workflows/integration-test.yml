name: WIF Bunker Integration Test

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only allow one integration test at a time to avoid project name collisions
concurrency:
  group: wif-bunker-integration
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for OIDC token exchange with GCP

jobs:
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux x64
            soft_key_flag: ""
          # Linux ARM64 disabled: ECP doesn't publish linux/arm64 binaries.
          # Re-enable when googleapis/enterprise-certificate-proxy adds ARM64.
          # - os: ubuntu-24.04-arm
          #   name: Linux ARM64
          #   soft_key_flag: ""
          - os: macos-15
            name: macOS ARM64 (Apple Silicon)
            soft_key_flag: ""
          - os: windows-2025
            name: Windows x64
            soft_key_flag: "--soft-key"
          # Windows ARM64 disabled: ECP (enterprise-certificate-proxy) doesn't
          # publish ARM64 binaries, and ARM64 Python can't load x86_64 DLLs.
          # Re-enable when googleapis/enterprise-certificate-proxy adds ARM64.
          # - os: windows-11-arm
          #   name: Windows ARM64
          #   soft_key_flag: "--soft-key"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Authenticate to GCP via WIF ──
      - id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ── Setup: Linux Software TPM ──
      - name: "Linux: Setup Software TPM (swtpm)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            swtpm swtpm-tools \
            tpm2-tools tpm2-abrmd libtss2-tcti-tabrmd0 dbus \
            libtpm2-pkcs11-1 libtpm2-pkcs11-tools \
            gnutls-bin

          SWTPM_DIR=$(mktemp -d)
          swtpm socket \
            --tpmstate dir="$SWTPM_DIR" \
            --tpm2 \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags not-need-init,startup-clear &
          sleep 2

          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address --address="unix:tmpdir=/tmp")
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

          export DBUS_SESSION_BUS_ADDRESS
          tpm2-abrmd \
            --tcti="swtpm:host=127.0.0.1,port=2321" \
            --session \
            --allow-root &
          sleep 1

          echo "TPM2TOOLS_TCTI=tabrmd:bus_type=session" >> "$GITHUB_ENV"
          echo "TPM2_PKCS11_TCTI=tabrmd:bus_type=session" >> "$GITHUB_ENV"

      # TEMPORARY: Build patched ECP on macOS for Secure Enclave support.
      # Remove once upstream ECP supports SecCertificateCopyData.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: runner.os == 'macOS'
        with:
          go-version: "1.26"
      - name: "macOS: Build patched ECP"
        if: runner.os == 'macOS'
        run: python3 patches/build_patched_ecp.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Setup: Python ──
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d ".venv/Scripts" ]; then
            source .venv/Scripts/activate
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            source .venv/bin/activate
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
          # Windows ARM64 has no PyPI cryptography wheel — install from jay0lee/cryptography-wheels
          if [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            WHEEL_URL=$(python -c "
          import json, urllib.request, sys
          rel = json.loads(urllib.request.urlopen('https://api.github.com/repos/jay0lee/cryptography-wheels/releases/latest').read())
          py_ver = f'cp{sys.version_info.major}{sys.version_info.minor}'
          for a in rel['assets']:
              if 'win_arm64' in a['name'] and (py_ver in a['name'] or 'abi3' in a['name']):
                  print(a['browser_download_url']); break
          ")
            echo "Installing cryptography wheel: $WHEEL_URL"
            pip install "$WHEEL_URL"
          fi
          pip install .

      # TEMPORARY: Patch google-auth to support hardware-backed keys.
      # Remove once upstream PRs land in google-auth and ECP.
      - name: "Patch google-auth (temporary)"
        shell: bash
        run: python patches/patch_google_auth.py

      # ── Generate unique project ID for this job ──
      - name: Set project ID
        id: config
        shell: bash
        run: |
          # GCP project IDs: 6-30 chars, lowercase, digits, hyphens
          PROJECT_ID="wif-ci-${{ github.run_id }}-${{ strategy.job-index }}"
          # Truncate to 30 chars max
          PROJECT_ID="${PROJECT_ID:0:30}"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Project ID: $PROJECT_ID"

      # ── Step 1: Cleanup stale projects from previous failed runs ──
      - name: "Cleanup stale test projects"
        shell: bash
        run: |
          echo "=== Cleaning up stale test projects ==="
          FOLDER_ID="${{ secrets.SANDBOX_FOLDER_ID }}"

          # List all active projects in the sandbox folder with wif-ci- prefix
          # Exclude the host project (wif-ci-host-*)
          PROJECTS=$(gcloud projects list \
            --filter="parent.id=$FOLDER_ID AND parent.type=folder AND projectId:wif-ci- AND NOT projectId:wif-ci-host- AND lifecycleState=ACTIVE" \
            --format="value(projectId,createTime)" \
            --sort-by=createTime 2>/dev/null || true)

          if [ -z "$PROJECTS" ]; then
            echo "No stale projects found."
            exit 0
          fi

          # Compute cutoff (1 hour ago) — works on both GNU and BSD date
          CUTOFF=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || \
                   date -u -v-1H +%Y-%m-%dT%H:%M:%S 2>/dev/null || \
                   echo "")

          while IFS=$'\t' read -r project_id create_time; do
            [ -z "$project_id" ] && continue

            # Skip projects newer than 1 hour (might be from concurrent runners)
            if [ -n "$CUTOFF" ] && [[ "$create_time" > "$CUTOFF" ]]; then
              echo "  Skipping recent project: $project_id (created $create_time)"
              continue
            fi

            echo "  Deleting stale project: $project_id (created $create_time)"
            gcloud projects delete "$project_id" --quiet 2>/dev/null || true
          done <<< "$PROJECTS"

          echo "Stale cleanup complete."

      # ── Windows ARM64: click through OOBE privacy wizard ──
      # GHA Windows ARM64 runners show a 2-page OOBE privacy dialog.
      # Can't be killed or minimized — must click through it.
      # (matches GAM-team/GAM ssd.mjs current production code)
      - name: "Windows ARM64: Dismiss OOBE"
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $wshell = New-Object -ComObject wscript.shell
          Start-Sleep -Seconds 3
          # Page 1: Tab past toggles to "Next" button, then Enter
          for ($i = 0; $i -lt 7; $i++) {
            $wshell.SendKeys('{TAB}')
            Start-Sleep -Milliseconds 200
          }
          $wshell.SendKeys('{ENTER}')
          Write-Host "OOBE Page 1: clicked Next"
          Start-Sleep -Seconds 3
          # Page 2: Tab past toggles to "Accept" button, then Enter
          for ($i = 0; $i -lt 7; $i++) {
            $wshell.SendKeys('{TAB}')
            Start-Sleep -Milliseconds 200
          }
          $wshell.SendKeys('{ENTER}')
          Write-Host "OOBE Page 2: clicked Accept"
          Start-Sleep -Seconds 3
          # Dismiss the Start menu that may appear after OOBE
          $wshell.SendKeys('{ESC}')
          Write-Host "OOBE dismissed."

      # ── Step 2: WIF Bunker fresh run (creates project, SA, pool, provider) ──
      - name: "WIF Bunker: Fresh setup"
        shell: bash
        run: |
          echo "=== Running WIF Bunker (fresh creation) ==="
          # On Windows, launch dialog auto-accept in background (clicks
          # Security Warning dialogs for CA root store operations).
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -File .github/scripts/win_dialog_accept.ps1 &
            DIALOG_PID=$!
            echo "Dialog auto-accept PID: $DIALOG_PID"
          fi
          python wif_bunker.py \
            --use-adc \
            --create-project="${{ steps.config.outputs.project_id }}" \
            --folder="${{ secrets.SANDBOX_FOLDER_ID }}" \
            ${{ matrix.soft_key_flag }}

      # ── Step 3: WIF Bunker reuse run (detects existing resources) ──
      - name: "WIF Bunker: Reuse existing"
        shell: bash
        run: |
          echo "=== Running WIF Bunker (reuse flow) ==="
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -File .github/scripts/win_dialog_accept.ps1 &
          fi
          python wif_bunker.py \
            --use-adc \
            --use-project="${{ steps.config.outputs.project_id }}" \
            --use-pool=bunker-wif-pool \
            --use-service-account="bunker-wif-sa@${{ steps.config.outputs.project_id }}.iam.gserviceaccount.com" \
            ${{ matrix.soft_key_flag }}

      # ── Upload Windows screenshots for dialog debugging ──
      - name: "Upload debug screenshots"
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: screenshots-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/*.png
            ${{ github.workspace }}/*.log

      # ── Step 4: Cleanup own project ──
      - name: "Cleanup test project"
        if: always()
        shell: bash
        run: |
          PROJECT_ID="${{ steps.config.outputs.project_id }}"
          if [ -n "$PROJECT_ID" ]; then
            echo "Deleting test project: $PROJECT_ID"
            gcloud projects delete "$PROJECT_ID" --quiet 2>/dev/null || true
          fi

      # ── Summary ──
      - name: Summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${{ matrix.name }}

          | Property | Value |
          |----------|-------|
          | **Runner** | \`${{ matrix.os }}\` |
          | **Architecture** | \`$(uname -m)\` |
          | **Project** | \`${{ steps.config.outputs.project_id }}\` |
          | **Soft Key** | \`${{ matrix.soft_key_flag || 'no (hardware/swtpm)' }}\` |

          EOF
