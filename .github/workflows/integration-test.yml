name: WIF Bunker Integration Test

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      wif_bunker_cmd:
        description: 'Command to invoke wif-bunker (e.g. $PYTHON -m wif_bunker or ./wif-bunker/wif-bunker)'
        required: false
        default: '$PYTHON -m wif_bunker'
        type: string
      use_built_binary:
        description: 'Set true to download and test a pre-built PyInstaller binary artifact'
        required: false
        default: false
        type: boolean
    secrets:
      WIF_PROVIDER:
        required: true

permissions:
  contents: read
  id-token: write  # Required for OIDC token exchange with GCP

jobs:
  # Each runner uses its own static pre-provisioned GCP project, WIF pool,
  # service account, and OIDC provider (PATCHed in place with each run's key).
  # Zero projects/pools/SAs/providers are created or deleted during normal CI runs!
  # Run .github/workflows/bootstrap-ci.yml manually when adding/removing runners.
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x64 (swtpm + linux-tpm signer) ──
          - os: ubuntu-22.04
            name: Linux x64 (22.04)
            runner_id: u2204-x64
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-22.04
          - os: ubuntu-24.04
            name: Linux x64 (24.04)
            runner_id: u2404-x64
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-24.04
          - os: ubuntu-26.04
            name: Linux x64 (26.04)
            runner_id: u2604-x64
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-26.04
          # ── Linux ARM64 (swtpm + linux-tpm signer) ──
          - os: ubuntu-22.04-arm
            name: Linux ARM64 (22.04)
            runner_id: u2204-arm
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-22.04-arm
          - os: ubuntu-24.04-arm
            name: Linux ARM64 (24.04)
            runner_id: u2404-arm
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-24.04-arm
          - os: ubuntu-26.04-arm
            name: Linux ARM64 (26.04)
            runner_id: u2604-arm
            signer_kind: linux-swtpm
            artifact_name: wif-bunker-ubuntu-26.04-arm
          # ── macOS ARM64 (GitHub VM has no Secure Enclave -> software PEM signer) ──
          - os: macos-15
            name: macOS ARM64 (15)
            runner_id: macos-15
            signer_kind: software-pem
            artifact_name: wif-bunker-macos-15
          - os: macos-26
            name: macOS ARM64 (26)
            runner_id: macos-26
            signer_kind: software-pem
            artifact_name: wif-bunker-macos-26
          # ── Windows x64 (Windows Certificate Store CNG signer) ──
          - os: windows-2025-vs2026
            name: Windows x64
            runner_id: windows
            signer_kind: windows-certstore
            artifact_name: wif-bunker-windows-2025-vs2026
          # ── Self-hosted real hardware (temporarily disabled while NUC8 is offline) ──
          # - name: Hardware TPM (NUC8)
          #   os: ubuntu-24.04
          #   runs_on: '["self-hosted", "Linux", "X64", "tpm"]'
          #   runner_id: nuc8-tpm
          #   signer_kind: linux-hw-tpm
          #   artifact_name: wif-bunker-ubuntu-24.04
          #   self_hosted: true
          # - name: YubiKey (NUC8)
          #   os: ubuntu-24.04
          #   runs_on: '["self-hosted", "Linux", "X64", "yk"]'
          #   runner_id: nuc8-yk
          #   signer_kind: yubikey
          #   artifact_name: wif-bunker-ubuntu-24.04
          #   self_hosted: true

    runs-on: ${{ matrix.runs_on && fromJSON(matrix.runs_on) || matrix.os }}
    name: ${{ matrix.name }}
    environment: ${{ matrix.self_hosted && 'tpm-hardware' || '' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUNNER_SA: ci-runner@wif-ci-${{ matrix.runner_id }}.iam.gserviceaccount.com
      TEST_PROJECT: wif-test-${{ matrix.runner_id }}
      POOL_ID: bunker-ci-pool
      PROVIDER_ID: bunker-ci-oidc
      BUNKER_SA: bunker-wif-sa@wif-test-${{ matrix.runner_id }}.iam.gserviceaccount.com
      WORKLOAD_SUBJECT: bunker-ci-workload
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Authenticate to GCP via WIF as this runner's static CI SA ──
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ci-runner@wif-ci-${{ matrix.runner_id }}.iam.gserviceaccount.com

      - if: ${{ !matrix.self_hosted }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ── Linux GH-hosted: install swtpm + abrmd resource manager + TSS2 libs ──
      - name: "Linux: Install Software TPM & TSS2 packages"
        if: matrix.signer_kind == 'linux-swtpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            swtpm swtpm-tools tpm2-tools tpm2-abrmd libtss2-tcti-tabrmd0 dbus \
            libtss2-dev libpcsclite-dev swig pkg-config

      - name: Set up latest Python and OpenSSL
        id: setup-python-ssl
        uses: jay0lee/python-openssl-latest@v1

      - name: Create venv and install dependencies
        run: |
          "${PYTHON}" -m venv venv
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            PYTHON="$GITHUB_WORKSPACE/venv/Scripts/python.exe"
            # google-cloud-python monorepo contains paths > 260 chars
            git config --global core.longpaths true
          else
            PYTHON="$GITHUB_WORKSPACE/venv/bin/python3"
          fi
          echo "PYTHON=${PYTHON}" >> "$GITHUB_ENV"

          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CFLAGS="-std=c11 ${CFLAGS:-}"
          fi
          "${PYTHON}" -m pip install --upgrade pip
          "${PYTHON}" -m pip install --upgrade --only-deps .

      # ── Download built binary (release testing) ──
      - name: "Download built binary (Linux/macOS)"
        if: inputs.use_built_binary && runner.os != 'Windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact

      - name: "Download built binary (Windows)"
        if: inputs.use_built_binary && runner.os == 'Windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact_name }}-raw
          path: wif-bunker

      - name: "Extract built binary (Linux/macOS)"
        if: inputs.use_built_binary && runner.os != 'Windows'
        shell: bash
        run: |
          tar -xzf artifact/*.tar.gz
          chmod +x wif-bunker/wif-bunker

      - name: "Diagnostic: wif-bunker versions"
        run: |
          WIF_CMD="${{ inputs.wif_bunker_cmd || '${PYTHON} -m wif_bunker' }}"
          $WIF_CMD versions

      # ── Baseline ADC verification ──
      - name: "ADC Baseline: GHA CI service account"
        run: |
          "${PYTHON}" -u scripts/minimal-adc.py 2>&1 | tee "$RUNNER_TEMP/adc_baseline.txt"
          grep -q "$RUNNER_SA" "$RUNNER_TEMP/adc_baseline.txt"

      # ── Fast idempotent check: ensure static pool & SA exist (no-op after first run) ──
      - name: "Ensure static per-runner pool & SA exist"
        run: |
          if ! gcloud iam workload-identity-pools describe "$POOL_ID" \
            --project="$TEST_PROJECT" --location=global &>/dev/null; then
            echo "Creating one-time static WIF pool: $POOL_ID in $TEST_PROJECT"
            gcloud iam workload-identity-pools create "$POOL_ID" \
              --project="$TEST_PROJECT" --location=global \
              --display-name="WIF Bunker Static CI Pool"
          fi
          if ! gcloud iam service-accounts describe "$BUNKER_SA" --project="$TEST_PROJECT" &>/dev/null; then
            echo "Creating one-time static SA: $BUNKER_SA"
            gcloud iam service-accounts create "bunker-wif-sa" \
              --project="$TEST_PROJECT" --display-name="WIF Bunker Static CI SA"
            sleep 10
          fi

      # ──────────────────────────────────────────────────────────────────
      # Provision a pre-existing key per platform (WIF Bunker only USES keys)
      # ──────────────────────────────────────────────────────────────────

      - name: "Provision pre-existing key: Linux swtpm persistent handle 0x81000001"
        if: matrix.signer_kind == 'linux-swtpm'
        run: |
          SWTPM_DIR="$RUNNER_TEMP/swtpm-state"
          mkdir -p "$SWTPM_DIR"
          swtpm socket \
            --tpmstate dir="$SWTPM_DIR" \
            --tpm2 \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags not-need-init,startup-clear &
          sleep 2

          # Run tpm2-abrmd as userspace resource manager (analogous to /dev/tpmrm0 on
          # real hardware) so transient object contexts swap transparently without 0x902.
          DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address --address="unix:tmpdir=$RUNNER_TEMP")
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS

          tpm2-abrmd \
            --tcti="swtpm:host=127.0.0.1,port=2321" \
            --session \
            --allow-root &
          sleep 1

          export TPM2TOOLS_TCTI="tabrmd:bus_type=session"
          echo "TPM2TOOLS_TCTI=${TPM2TOOLS_TCTI}" >> "$GITHUB_ENV"

          tpm2_createprimary -C o -g sha256 -G ecc -c "$RUNNER_TEMP/primary.ctx"
          tpm2_create -C "$RUNNER_TEMP/primary.ctx" -g sha256 -G ecc256:ecdsa-sha256 \
            -u "$RUNNER_TEMP/key.pub" -r "$RUNNER_TEMP/key.priv"
          tpm2_load -C "$RUNNER_TEMP/primary.ctx" \
            -u "$RUNNER_TEMP/key.pub" -r "$RUNNER_TEMP/key.priv" -c "$RUNNER_TEMP/key.ctx"
          tpm2_evictcontrol -C o -c "$RUNNER_TEMP/key.ctx" 0x81000001
          tpm2_flushcontext --transient-object
          echo "SIGNER_FLAGS=--signer linux-tpm --tpm-handle 0x81000001" >> "$GITHUB_ENV"

      - name: "Provision pre-existing key: Linux hardware TPM handle 0x81000001"
        if: matrix.signer_kind == 'linux-hw-tpm'
        run: |
          # NEVER touch NV indices — only evict persistent handles and flush transient state.
          TPM_PROPS=$(tpm2_getcap properties-variable)
          IN_LOCKOUT=$(echo "$TPM_PROPS" | grep -oP 'inLockout:\s+\K\d+' || echo "0")
          LOCKOUT_AUTH_SET=$(echo "$TPM_PROPS" | grep -oP 'lockoutAuthSet:\s+\K\d+' || echo "0")
          if [ "$IN_LOCKOUT" = "1" ] && [ "$LOCKOUT_AUTH_SET" = "0" ]; then
            tpm2_dictionarylockout --clear
          elif [ "$IN_LOCKOUT" = "1" ] || [ "$LOCKOUT_AUTH_SET" = "1" ]; then
            echo "::error::TPM is in lockout (inLockout=$IN_LOCKOUT, lockoutAuthSet=$LOCKOUT_AUTH_SET)."
            exit 1
          fi

          tpm2_flushcontext --transient-object
          tpm2_flushcontext --loaded-session
          tpm2_flushcontext --saved-session
          HANDLES=$(tpm2_getcap handles-persistent | grep -oP '0x[0-9A-Fa-f]+' || true)
          for h in $HANDLES; do
            tpm2_evictcontrol -c "$h"
          done

          tpm2_createprimary -C o -g sha256 -G ecc -c "$RUNNER_TEMP/primary.ctx"
          tpm2_create -C "$RUNNER_TEMP/primary.ctx" -g sha256 -G ecc256:ecdsa-sha256 \
            -u "$RUNNER_TEMP/key.pub" -r "$RUNNER_TEMP/key.priv"
          tpm2_load -C "$RUNNER_TEMP/primary.ctx" \
            -u "$RUNNER_TEMP/key.pub" -r "$RUNNER_TEMP/key.priv" -c "$RUNNER_TEMP/key.ctx"
          tpm2_evictcontrol -C o -c "$RUNNER_TEMP/key.ctx" 0x81000001
          tpm2_flushcontext --transient-object
          echo "SIGNER_FLAGS=--signer linux-tpm --tpm-handle 0x81000001" >> "$GITHUB_ENV"

      - name: "Provision pre-existing key: YubiKey PIV slot 9c"
        if: matrix.signer_kind == 'yubikey'
        id: yubikey
        run: |
          KEYS=$("${PYTHON}" -c "from ykman.device import list_all_devices; [print(i.serial, '%d.%d.%d' % i.version) for _, i in list_all_devices()]")
          KEY_COUNT=$(echo "$KEYS" | wc -l | tr -d ' ')
          if [ "$KEY_COUNT" -lt 1 ]; then
            echo "::error::No YubiKey detected"
            exit 1
          fi
          RANDOM_INDEX=$(( (RANDOM % KEY_COUNT) + 1 ))
          SERIAL=$(echo "$KEYS" | sed -n "${RANDOM_INDEX}p" | cut -d' ' -f1)
          echo "Selected YubiKey serial=$SERIAL"
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"

          # Reset PIV and generate a fresh ES256 key in slot 9c (on-device so attestation passes!)
          "${PYTHON}" - "$SERIAL" <<'PYEOF'
          import sys
          from ykman.device import list_all_devices
          from yubikit.core.smartcard import SmartCardConnection
          from yubikit.piv import DEFAULT_MANAGEMENT_KEY, KEY_TYPE, PIN_POLICY, SLOT, TOUCH_POLICY, PivSession

          serial = int(sys.argv[1])
          for dev, info in list_all_devices():
              if info.serial == serial:
                  with dev.open_connection(SmartCardConnection) as conn:
                      piv = PivSession(conn)
                      piv.reset()
                      piv.authenticate(DEFAULT_MANAGEMENT_KEY)
                      piv.generate_key(
                          SLOT.SIGNATURE,
                          KEY_TYPE.ECCP256,
                          pin_policy=PIN_POLICY.ONCE,
                          touch_policy=TOUCH_POLICY.NEVER,
                      )
                      print(f"Generated ES256 key in PIV slot 9c on YubiKey {serial}")
                  break
          PYEOF

          echo "SIGNER_FLAGS=--signer yubikey --yubikey-slot 9c --yubikey-serial ${SERIAL} --yubikey-pin 123456" >> "$GITHUB_ENV"

      - name: "Provision pre-existing key: macOS CI software PEM"
        if: matrix.signer_kind == 'software-pem'
        run: |
          KEY_PATH="$RUNNER_TEMP/ci-ec-key.pem"
          openssl ecparam -name prime256v1 -genkey -noout -out "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "SIGNER_FLAGS=--signer software --software-key-file ${KEY_PATH}" >> "$GITHUB_ENV"

      - name: "Provision pre-existing key: Windows Cert Store ECDSA P-256"
        if: matrix.signer_kind == 'windows-certstore'
        shell: pwsh
        run: |
          Import-Module Microsoft.PowerShell.Security -ErrorAction SilentlyContinue
          Import-Module PKI -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq 'CN=WIF Bunker CI' } | Remove-Item
          $cert = New-SelfSignedCertificate `
            -Subject "CN=WIF Bunker CI" `
            -KeyAlgorithm ECDSA_nistP256 `
            -KeyExportPolicy NonExportable `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddDays(7)
          Write-Host "Created Windows Cert Store cert: thumbprint=$($cert.Thumbprint)"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNER_FLAGS=--signer windows-certstore --windows-thumbprint $($cert.Thumbprint)"

      # ──────────────────────────────────────────────────────────────────
      # Test 1: Setup (reuses static project, pool, SA & PATCHes static provider)
      # ──────────────────────────────────────────────────────────────────
      - name: "WIF Bunker: setup (with static SA & in-place provider PATCH)"
        run: |
          WIF_CMD="${{ inputs.wif_bunker_cmd || '${PYTHON} -m wif_bunker' }}"
          $WIF_CMD setup \
            --debug \
            --use-adc \
            --use-project="$TEST_PROJECT" \
            --use-pool="$POOL_ID" \
            --use-provider="$PROVIDER_ID" \
            --use-service-account="$BUNKER_SA" \
            --subject="$WORKLOAD_SUBJECT" \
            --config "$RUNNER_TEMP/bunker.json" \
            --write-executable-adc \
            --adc-file "$RUNNER_TEMP/adc-exec.json" \
            --executable-cache-file "$RUNNER_TEMP/jwt-cache.json" \
            $SIGNER_FLAGS

      # ── Test 2: Daemon-less executable ADC mode ──
      - name: "ADC Test: Executable mode (wif-bunker sign-jwt)"
        run: |
          export GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES=1
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/adc-exec.json"
          export GOOGLE_CLOUD_PROJECT="$TEST_PROJECT"
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true

          "${PYTHON}" scripts/minimal-adc.py --project="$TEST_PROJECT" | tee "$RUNNER_TEMP/adc_exec_out.txt"
          if grep -q "$RUNNER_SA" "$RUNNER_TEMP/adc_exec_out.txt"; then
            echo "::error::Accidentally used GHA CI SA instead of bunker creds"
            exit 1
          fi
          grep -q "$BUNKER_SA" "$RUNNER_TEMP/adc_exec_out.txt"

      # ── Test 3: Localhost caching agent (1 HW sign across 3 ADC runs!) ──
      - name: "ADC Test: Agent mode (1 hardware sign across 3 ADC runs)"
        run: |
          WIF_CMD="${{ inputs.wif_bunker_cmd || '${PYTHON} -m wif_bunker' }}"
          $WIF_CMD agent \
            --config "$RUNNER_TEMP/bunker.json" \
            --adc-file "$RUNNER_TEMP/adc-agent.json" \
            --secret-file "$RUNNER_TEMP/agent-secret" \
            --warm &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            [ -f "$RUNNER_TEMP/adc-agent.json" ] && break
            sleep 1
          done
          test -f "$RUNNER_TEMP/adc-agent.json"

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/adc-agent.json"
          export GOOGLE_CLOUD_PROJECT="$TEST_PROJECT"
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true

          for run_idx in 1 2 3; do
            echo "--- Agent ADC run ${run_idx} ---"
            "${PYTHON}" scripts/minimal-adc.py --project="$TEST_PROJECT" | tee "$RUNNER_TEMP/adc_agent_${run_idx}.txt"
            if grep -q "$RUNNER_SA" "$RUNNER_TEMP/adc_agent_${run_idx}.txt"; then
              echo "::error::Accidentally used GHA CI SA"
              exit 1
            fi
          done

          # Verify agent cached the token (1 hardware sign, >= 2 cache hits)
          "${PYTHON}" - "$RUNNER_TEMP/adc-agent.json" <<'PYEOF'
          import json, sys, requests
          adc = json.load(open(sys.argv[1], encoding="utf-8"))
          health_url = adc["token_url"].rsplit("/v1/token", 1)[0] + "/health"
          stats = requests.get(health_url, timeout=5).json()
          print("Agent health stats:", json.dumps(stats, indent=2))
          assert stats["hardware_signs"] == 1, f"Expected 1 hardware sign, got {stats['hardware_signs']}"
          assert stats["cache_hits"] >= 2, f"Expected >= 2 cache hits, got {stats['cache_hits']}"
          PYEOF

          # Also test `wif-bunker status` against the running agent
          $WIF_CMD status \
            --config "$RUNNER_TEMP/bunker.json" \
            --adc-file "$RUNNER_TEMP/adc-agent.json"

      # ── Test 4: Direct federated WIF (--no-service-account) ──
      - name: "WIF Bunker: setup (--no-service-account) + agent ADC test"
        run: |
          WIF_CMD="${{ inputs.wif_bunker_cmd || '${PYTHON} -m wif_bunker' }}"
          $WIF_CMD setup \
            --use-adc \
            --use-project="$TEST_PROJECT" \
            --use-pool="$POOL_ID" \
            --use-provider="$PROVIDER_ID" \
            --no-service-account \
            --subject="$WORKLOAD_SUBJECT" \
            --config "$RUNNER_TEMP/bunker-nosa.json" \
            $SIGNER_FLAGS

          $WIF_CMD agent \
            --config "$RUNNER_TEMP/bunker-nosa.json" \
            --adc-file "$RUNNER_TEMP/adc-nosa.json" \
            --secret-file "$RUNNER_TEMP/agent-secret-nosa" &
          AGENT_PID=$!
          trap 'kill "$AGENT_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            [ -f "$RUNNER_TEMP/adc-nosa.json" ] && break
            sleep 1
          done
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/adc-nosa.json"
          export GOOGLE_CLOUD_PROJECT="$TEST_PROJECT"
          unset CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE || true
          "${PYTHON}" scripts/minimal-adc.py --project="$TEST_PROJECT" | tee "$RUNNER_TEMP/adc_nosa_out.txt"
          if grep -q "$RUNNER_SA" "$RUNNER_TEMP/adc_nosa_out.txt"; then
            echo "::error::Accidentally used GHA CI SA"
            exit 1
          fi

      # ── Test 5: Read-only hardware attestation ──
      - name: "Test wif-bunker attest (read-only hardware attestation)"
        run: |
          WIF_CMD="${{ inputs.wif_bunker_cmd || '${PYTHON} -m wif_bunker' }}"
          ATTEST_DIR="$RUNNER_TEMP/attest-out"
          mkdir -p "$ATTEST_DIR"
          $WIF_CMD attest --config "$RUNNER_TEMP/bunker.json" --output-dir "$ATTEST_DIR"

          test -f "$ATTEST_DIR/attestation_report.json"
          test -f "$ATTEST_DIR/attestation_report.txt"

          "${PYTHON}" - "$ATTEST_DIR/attestation_report.json" "${{ matrix.self_hosted || 'false' }}" <<'PYEOF'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          is_hw = sys.argv[2] == "true"
          print(f"Attestation: platform={report['platform']} {report['checks_passed']}/{report['checks_total']} passed")
          assert report["checks_total"] > 0
          if is_hw:
              assert report["checks_passed"] == report["checks_total"], (
                  f"Hardware attestation failed: {report['checks_passed']}/{report['checks_total']}"
              )
          PYEOF

      # ── Cleanup hardware / cert store (GCP static resources stay intact!) ──
      - name: "Cleanup self-hosted hardware"
        if: always() && matrix.self_hosted
        run: |
          if [ "${{ matrix.signer_kind }}" = "linux-hw-tpm" ]; then
            HANDLES=$(tpm2_getcap handles-persistent | grep -oP '0x[0-9A-Fa-f]+' || true)
            for h in $HANDLES; do tpm2_evictcontrol -c "$h"; done
          elif [ "${{ matrix.signer_kind }}" = "yubikey" ] && [ -n "${{ steps.yubikey.outputs.serial }}" ]; then
            "${PYTHON}" -c "import sys; from ykman.device import list_all_devices; from yubikit.core.smartcard import SmartCardConnection; from yubikit.piv import PivSession; serial=int(sys.argv[1]); [PivSession(dev.open_connection(SmartCardConnection)).reset() for dev, info in list_all_devices() if info.serial == serial]" "${{ steps.yubikey.outputs.serial }}"
          fi

      - name: "Cleanup Windows Cert Store test cert"
        if: always() && matrix.signer_kind == 'windows-certstore'
        shell: pwsh
        run: |
          Import-Module Microsoft.PowerShell.Security -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq 'CN=WIF Bunker CI' } | Remove-Item
