name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # ── Job 0: Generate a single version for all jobs ──
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
    steps:
      - name: Generate datetime version
        id: gen
        run: |
          VERSION=$(date -u +%Y.%m.%d.%H%M)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # ── Job 1: Build on all platforms ──
  build:
    name: Build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm, macos-15, macos-26, windows-2025-vs2026]

    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Paths to pre-built OpenSSL + Python (from build-python-ssl.yml cache)
      OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl
      PYTHON_INSTALL_PATH: ${{ github.workspace }}/bin/python
      # Force Python to use UTF-8 for stdout/stderr on Windows (default is cp1252)
      PYTHONIOENCODING: utf-8
      # Windows code signing — cert SHA1 thumbprint (public, not secret)
      WINDOWS_CODESIGN_CERT_HASH: 3B11D9340A45CF078FF7FD984F1C3E30DA82FD05

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ══════════════════════════════════════════════════════════════════════
      # Restore pre-built OpenSSL + Python from cache
      # Built daily by build-python-ssl.yml — restore-keys prefix match
      # falls back to the most recent successful build.
      # ══════════════════════════════════════════════════════════════════════

      - name: "Restore compiled OpenSSL + Python"
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-${{ matrix.os }}-v2-
          restore-keys: |
            python-ssl-${{ matrix.os }}-v2-
          fail-on-cache-miss: true

      - name: "Set PYTHON env var and library paths"
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PYTHON="${PYTHON_INSTALL_PATH}/python.exe"
            echo "${PYTHON_INSTALL_PATH}" >> "$GITHUB_PATH"
            echo "${PYTHON_INSTALL_PATH}/Scripts" >> "$GITHUB_PATH"
          else
            export PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
            echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"
          fi

          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH}"
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Compiled Python binary: ${PYTHON}"
          ls -la "${PYTHON}" 2>/dev/null || echo "WARNING: ${PYTHON} does not exist!"

      - name: "Verify compiled Python + OpenSSL"
        run: |
          echo "PYTHON=${PYTHON}"
          "${PYTHON}" --version
          "${PYTHON}" -c "import ssl; print(f'Python ssl module OpenSSL: {ssl.OPENSSL_VERSION}')"

      - name: Inject version
        run: |
          sed -i.bak "s/__version__ = \"dev\"/__version__ = \"$VERSION\"/" wif_bunker/__init__.py
          rm -f wif_bunker/__init__.py.bak
          grep __version__ wif_bunker/__init__.py

      - name: Generate Windows version info
        if: runner.os == 'Windows'
        run: |
          IFS='.' read -r YEAR MONTH DAY HHMM <<< "$VERSION"
          MONTH=$((10#$MONTH))
          DAY=$((10#$DAY))
          HHMM=$((10#$HHMM))
          sed -e "s/{YEAR}/$YEAR/g" \
              -e "s/{MONTH}/$MONTH/g" \
              -e "s/{DAY}/$DAY/g" \
              -e "s/{HHMM}/$HHMM/g" \
              -e "s/{VERSION_STR}/$VERSION/g" \
              packaging/windows/version_info.txt.in > version_info.txt
          cat version_info.txt

      # ══════════════════════════════════════════════════════════════════════
      # Build hardmTLS + package
      # ══════════════════════════════════════════════════════════════════════

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: "Windows: Configure MSVC for hardmTLS"
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch }}

      - name: "Windows: Hide Git link.exe (shadows MSVC)"
        if: runner.os == 'Windows'
        run: |
          GIT_LINK="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$GIT_LINK" ]; then
            mv "$GIT_LINK" "${GIT_LINK}.bak"
            echo "Renamed Git link.exe to avoid MSVC collision"
          fi

      - name: Build hardmTLS
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo build --release

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev libtss2-dev pkg-config

      - name: Install dependencies
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: |
          "${PYTHON}" -m pip install --upgrade pip
          "${PYTHON}" -m pip install pyinstaller
          # Build cryptography from source against our compiled OpenSSL so the
          # bundled cryptography, Python, hardmTLS, and libcrypto all link the
          # same OpenSSL.  Pre-built PyPI wheels are compiled against OpenSSL
          # 3.x which conflicts with our bundled OpenSSL 4.x libcrypto.
          "${PYTHON}" -m pip install --no-binary cryptography --no-cache-dir cryptography
          "${PYTHON}" -m pip install --only-deps ".[yubikey]"

      # ══════════════════════════════════════════════════════════════════════
      # macOS: Import developer certificate for code signing
      # Skipped when CERTIFICATES_P12 secret is not set.
      # ══════════════════════════════════════════════════════════════════════

      - name: "macOS: Import developer certificates"
        if: runner.os == 'macOS' && env.CERTIFICATES_P12 != ''
        uses: apple-actions/import-codesign-certs@b610f78488812c1e56b20e6df63ec42d833f2d14 # v6.0.0
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: "macOS: Set codesign identity"
        if: runner.os == 'macOS' && env.CERTIFICATES_P12 != ''
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
        run: |
          echo "codesign_identity=Jay Lee" >> $GITHUB_ENV

      - name: Run PyInstaller
        run: |
          pwd
          ls -alRF
          mv packaging/wif-bunker.spec . 
          pyinstaller wif-bunker.spec

      - name: Smoke test
        run: |
          dist/wif-bunker/wif-bunker --version
          dist/wif-bunker/wif-bunker --help


      # ══════════════════════════════════════════════════════════════════════
      # Windows: Code signing with Certum SimplySign Desktop
      # Skipped when TOTP_SECRET is not set.
      # ══════════════════════════════════════════════════════════════════════

      - name: "Windows: Install NPM deps for signing"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: npm install totp-generator

      - name: "Windows: Install Certum SimplySign Desktop"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: pwsh
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          $url = "https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi"
          $file = "SimplySignDesktop.msi"
          Invoke-WebRequest $url -OutFile $file
          $log = "install.log"
          $procMain = Start-Process "msiexec" "/i `"$file`" /qn /l*! `"$log`"" -NoNewWindow -PassThru
          $procLog = Start-Process "powershell" "Get-Content -Path `"$log`" -Wait" -NoNewWindow -PassThru
          $procMain.WaitForExit()
          $procLog.Kill()

      - name: "Windows: Launch SimplySign Desktop"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: pwsh
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          Write-Host "Running SSD..."
          & "C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe"
          Start-Sleep -Seconds 10
          & "C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe"

      - name: "Windows: Login to Certum"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: pwsh
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          Write-Host "Running SimplySignDesktop login..."
          node tools/ssd.mjs --log-level warn
          Get-ChildItem -Path $env:GITHUB_WORKSPACE
          Write-Host "Sleeping during login..."
          Start-Sleep 10

      - name: "Windows: Upload signing debug screenshots"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        with:
          archive: true
          name: signing-screenshots-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            ${{ github.workspace }}/*.png
            ${{ github.workspace }}/*.log

      - name: "Windows: Sign wif-bunker.exe"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: pwsh
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          $exe = "dist\wif-bunker\wif-bunker.exe"
          Write-Host "Signing $exe..."
          # Always use x64 signtool — ARM64 version can't see Certum certs
          # since SimplySignDesktop is x64-only.
          Start-Process -Wait -NoNewWindow -ErrorAction Continue `
            -FilePath 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe' `
            -ArgumentList "sign", "/sha1", "$env:WINDOWS_CODESIGN_CERT_HASH", "/tr", "http://time.certum.pl", "/td", "SHA256", "/fd", "SHA256", "/v", "$exe"
          Write-Host "Verifying signature..."
          & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe' verify /pa /v "$exe"

      # ══════════════════════════════════════════════════════════════════════
      # Package
      # ══════════════════════════════════════════════════════════════════════

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf wif-bunker-${VERSION}-${{ matrix.os }}.tar.gz -C dist wif-bunker/

      # macOS: Submit for Apple notarization (fire-and-forget).
      # Skipped when APPLE_KEY secret is not set.
      - name: "macOS: Submit for Apple notarization"
        if: runner.os == 'macOS' && env.APPLE_KEY != ''
        env:
          APPLE_KEY: ${{ secrets.APPLE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          zipfilename="./wif-bunker-${RUNNER_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_NUMBER}.zip"
          zip -r "$zipfilename" dist/wif-bunker/
          export KEY_FILE="$(mktemp).p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$APPLE_KEY" > "$KEY_FILE"
          xcrun notarytool submit "$zipfilename" --key "$KEY_FILE" --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID"
          rm -v "$zipfilename"

      - name: Package (Windows — InnoSetup)
        if: runner.os == 'Windows' && env.TOTP_SECRET == ''
        shell: bash
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          iscc /DVersion="$VERSION" 'packaging\windows\wif-bunker.iss'

      - name: "Debug: dump iscc signed command"
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: bash
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== ISS file ==="
          ls -la 'packaging\windows\wif-bunker.iss' || ls -la packaging/windows/wif-bunker.iss
          echo "=== WINDOWS_CODESIGN_CERT_HASH ==="
          echo "$WINDOWS_CODESIGN_CERT_HASH"
          echo "=== VERSION ==="
          echo "$VERSION"
          echo "=== iscc location ==="
          which iscc || echo "iscc not on PATH, using full path"
          echo "=== Command that will run ==="
          signtool="C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          printf 'Arg: %q\n' \
            /S"wifbunkersigntool=$signtool sign /sha1 $WINDOWS_CODESIGN_CERT_HASH /tr http://time.certum.pl /td SHA256 /fd SHA256 /v \$f" \
            /DVersion="$VERSION" \
            'packaging\windows\wif-bunker.iss'

      - name: Package (Windows — InnoSetup, signed)
        if: runner.os == 'Windows' && env.TOTP_SECRET != ''
        shell: bash
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          signtool="C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe"
          iscc \
            /S"wifbunkersigntool=$signtool sign /sha1 $WINDOWS_CODESIGN_CERT_HASH /tr http://time.certum.pl /td SHA256 /fd SHA256 /v \$f" \
            /DVersion="$VERSION" \
            'packaging\windows\wif-bunker.iss'

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.os }}
          path: wif-bunker-*.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.os }}
          path: packaging\windows\Output\wif-bunker-*-setup.exe

      # Upload raw build directory for integration testing (InnoSetup
      # installer can't be silently extracted in CI).
      - name: Upload raw binary (Windows — for integration test)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.os }}-raw
          path: dist/wif-bunker/

      # ── Attestation: cryptographic proof this artifact was built here ──
      - name: Attest build provenance (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: wif-bunker-*.tar.gz

      - name: Attest build provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: packaging\windows\Output\wif-bunker-*-setup.exe

      # ── SBOM: software bill of materials ──
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/wif-bunker/
          artifact-name: sbom-${{ matrix.os }}.spdx.json
          output-file: sbom-${{ matrix.os }}.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.os }}
          path: sbom-${{ matrix.os }}.spdx.json

  # ── Job 2: Integration test with built binary ──
  integration-test:
    needs: build
    uses: ./.github/workflows/integration-test.yml
    with:
      wif_bunker_cmd: './wif-bunker/wif-bunker'
      use_built_binary: true
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      SANDBOX_FOLDER_ID: ${{ secrets.SANDBOX_FOLDER_ID }}
      WIF_POOL_NAME: ${{ secrets.WIF_POOL_NAME }}

  # ── Job 3: Tag + Release (only if tests pass) ──
  release:
    name: Publish Release
    needs: [version, build, integration-test]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: wif-bunker-*
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: sbom-*
          merge-multiple: true

      # Remove the raw Windows binary directory if it leaked through
      # (the -raw artifact is only for integration testing).
      - name: Clean up non-release files
        run: |
          cd artifacts
          rm -rf lib ecp hardmtls _internal
          find . -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*-setup.exe' ! -name '*.spdx.json' -delete
          echo "Release artifacts:"
          ls -la

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f | sort | xargs sha256sum > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attest checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: WIF Bunker ${{ needs.version.outputs.version }}
          files: |
            artifacts/*
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Verify

            **Checksums:**
            ```
            sha256sum -c SHA256SUMS.txt
            ```

            **Attestation:**
            ```
            gh attestation verify PATH/TO/ARTIFACT -R jay0lee/wif-bunker
            ```
