name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # ── Job 0: Generate a single version for all jobs ──
  version:
    name: Generate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
    steps:
      - name: Generate datetime version
        id: gen
        run: |
          VERSION=$(date -u +%Y.%m.%d.%H%M)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  # ── Job 1: Build on all platforms ──
  build:
    name: Build (${{ matrix.platform_name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_name: linux
            arch: x86_64
          - os: macos-15
            platform_name: macos
            arch: arm64
          - os: windows-2025
            platform_name: windows
            arch: x86_64

    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Paths to pre-built OpenSSL + Python (from build-python-ssl.yml cache)
      OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl
      PYTHON_INSTALL_PATH: ${{ github.workspace }}/bin/python

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ══════════════════════════════════════════════════════════════════════
      # Restore pre-built OpenSSL + Python from cache
      # Built daily by build-python-ssl.yml — restore-keys prefix match
      # falls back to the most recent successful build.
      # ══════════════════════════════════════════════════════════════════════

      - name: "Restore compiled OpenSSL + Python"
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-${{ runner.os }}-${{ runner.arch }}-v1-
          restore-keys: |
            python-ssl-${{ runner.os }}-${{ runner.arch }}-v1-
          fail-on-cache-miss: true

      - name: "Set PYTHON env var and library paths"
        shell: bash
        run: |
          # Set the exact path to our compiled Python binary.
          # On Windows, CPython installs as python.exe (no python3 symlink).
          # Using $PYTHON everywhere avoids picking up a system Python.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PYTHON="${PYTHON_INSTALL_PATH}/python.exe"
            echo "${PYTHON_INSTALL_PATH}" >> "$GITHUB_PATH"
            echo "${PYTHON_INSTALL_PATH}/Scripts" >> "$GITHUB_PATH"
          else
            export PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
            echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"
          fi

          # Library search paths — set for ALL OSes so our compiled OpenSSL
          # is always found before any system copy.
          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH}"
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Compiled Python binary: ${PYTHON}"
          ls -la "${PYTHON}" 2>/dev/null || echo "WARNING: ${PYTHON} does not exist!"
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"

      - name: "Verify compiled Python + OpenSSL"
        shell: bash
        run: |
          echo "PYTHON=${PYTHON}"
          "${PYTHON}" --version
          "${PYTHON}" -c "import ssl; print(f'Python ssl module OpenSSL: {ssl.OPENSSL_VERSION}')"

      - name: Inject version
        shell: bash
        run: |
          sed -i.bak "s/__version__ = \"dev\"/__version__ = \"$VERSION\"/" wif_bunker/__init__.py
          rm -f wif_bunker/__init__.py.bak
          grep __version__ wif_bunker/__init__.py

      - name: Generate Windows version info
        if: matrix.platform_name == 'windows'
        shell: bash
        run: |
          IFS='.' read -r YEAR MONTH DAY HHMM <<< "$VERSION"
          MONTH=$((10#$MONTH))
          DAY=$((10#$DAY))
          HHMM=$((10#$HHMM))
          sed -e "s/{YEAR}/$YEAR/g" \
              -e "s/{MONTH}/$MONTH/g" \
              -e "s/{DAY}/$DAY/g" \
              -e "s/{HHMM}/$HHMM/g" \
              -e "s/{VERSION_STR}/$VERSION/g" \
              packaging/windows/version_info.txt.in > version_info.txt
          cat version_info.txt

      # ══════════════════════════════════════════════════════════════════════
      # Build hardmTLS + package
      # ══════════════════════════════════════════════════════════════════════

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: "Windows: Configure MSVC for hardmTLS"
        if: matrix.platform_name == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch }}

      - name: Build hardmTLS
        working-directory: hardmtls-native
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: cargo build --release

      - name: Install system dependencies (Linux)
        if: matrix.platform_name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libtss2-dev pkg-config

      - name: Install dependencies
        run: |
          "${PYTHON}" -m pip install --upgrade pip
          "${PYTHON}" -m pip install pyinstaller
          "${PYTHON}" -m pip install --only-deps ".[yubikey]"

      - name: Run PyInstaller
        run: pyinstaller wif-bunker.spec

      - name: Smoke test (Unix)
        if: matrix.platform_name != 'windows'
        run: |
          dist/wif-bunker/wif-bunker --version
          dist/wif-bunker/wif-bunker --help

      - name: Smoke test (Windows)
        if: matrix.platform_name == 'windows'
        shell: pwsh
        run: |
          dist\wif-bunker\wif-bunker.exe --version
          dist\wif-bunker\wif-bunker.exe --help

      - name: Package (Linux)
        if: matrix.platform_name == 'linux'
        run: tar -czf wif-bunker-${VERSION}-linux-x86_64.tar.gz -C dist wif-bunker/

      - name: Package (macOS)
        if: matrix.platform_name == 'macos'
        run: tar -czf wif-bunker-${VERSION}-macos-arm64.tar.gz -C dist wif-bunker/

      - name: Package (Windows — InnoSetup)
        if: matrix.platform_name == 'windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DVersion=$env:VERSION packaging\windows\wif-bunker.iss

      - name: Upload artifact (Linux/macOS)
        if: matrix.platform_name != 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: wif-bunker-*.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.platform_name == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: packaging\windows\Output\wif-bunker-*-setup.exe

      # Upload raw build directory for integration testing (InnoSetup
      # installer can't be silently extracted in CI).
      - name: Upload raw binary (Windows — for integration test)
        if: matrix.platform_name == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wif-bunker-${{ matrix.platform_name }}-${{ matrix.arch }}-raw
          path: dist/wif-bunker/

      # ── Attestation: cryptographic proof this artifact was built here ──
      - name: Attest build provenance (Linux/macOS)
        if: matrix.platform_name != 'windows'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: wif-bunker-*.tar.gz

      - name: Attest build provenance (Windows)
        if: matrix.platform_name == 'windows'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: packaging\windows\Output\wif-bunker-*-setup.exe

      # ── SBOM: software bill of materials ──
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/wif-bunker/
          artifact-name: sbom-${{ matrix.platform_name }}-${{ matrix.arch }}.spdx.json
          output-file: sbom-${{ matrix.platform_name }}-${{ matrix.arch }}.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.platform_name }}-${{ matrix.arch }}
          path: sbom-${{ matrix.platform_name }}-${{ matrix.arch }}.spdx.json

  # ── Job 2: Integration test with built binary ──
  integration-test:
    needs: build
    uses: ./.github/workflows/integration-test.yml
    with:
      wif_bunker_cmd: './wif-bunker/wif-bunker'
      use_built_binary: true
    secrets:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      SANDBOX_FOLDER_ID: ${{ secrets.SANDBOX_FOLDER_ID }}
      WIF_POOL_NAME: ${{ secrets.WIF_POOL_NAME }}

  # ── Job 3: Tag + Release (only if tests pass) ──
  release:
    name: Publish Release
    needs: [version, build, integration-test]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: wif-bunker-*
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: sbom-*
          merge-multiple: true

      # Remove the raw Windows binary directory if it leaked through
      # (the -raw artifact is only for integration testing).
      - name: Clean up non-release files
        run: |
          cd artifacts
          rm -rf lib ecp hardmtls _internal
          find . -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*-setup.exe' ! -name '*.spdx.json' -delete
          echo "Release artifacts:"
          ls -la

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f | sort | xargs sha256sum > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attest checksums
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: WIF Bunker ${{ needs.version.outputs.version }}
          files: |
            artifacts/*
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Verify

            **Checksums:**
            ```
            sha256sum -c SHA256SUMS.txt
            ```

            **Attestation:**
            ```
            gh attestation verify PATH/TO/ARTIFACT -R jay0lee/wif-bunker
            ```
