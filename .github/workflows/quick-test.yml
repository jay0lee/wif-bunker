name: Quick Test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to target'
        required: true
        type: choice
        options:
          - 'hardware-tpm'
          - 'yubikey'
          - 'ubuntu-24.04'
          - 'ubuntu-26.04'
          - 'macos-15'
          - 'windows-2025-vs2026'
      script:
        description: 'Bash script to run (overrides quick-test-script.sh)'
        required: false
        type: string
      install_wif_bunker:
        description: 'Install wif-bunker and dependencies into a venv'
        required: false
        type: boolean
        default: true
      setup_tpm:
        description: 'Reset TPM to clean state (hardware-tpm only)'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/quick-test-config.json'
      - '.github/quick-test-script.sh'

permissions:
  contents: read
  id-token: write

jobs:
  # ── Read config from file (push-triggered) or inputs (dispatch) ──
  config:
    name: "Load config"
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runner }}
      install_wif_bunker: ${{ steps.cfg.outputs.install_wif_bunker }}
      setup_tpm: ${{ steps.cfg.outputs.setup_tpm }}
      script: ${{ steps.cfg.outputs.script }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Parse config"
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "runner=${{ inputs.runner }}" >> "$GITHUB_OUTPUT"
            echo "install_wif_bunker=${{ inputs.install_wif_bunker }}" >> "$GITHUB_OUTPUT"
            echo "setup_tpm=${{ inputs.setup_tpm }}" >> "$GITHUB_OUTPUT"
            if [ -n "${{ inputs.script }}" ]; then
              # Use dispatch script input
              {
                echo 'script<<SCRIPT_EOF'
                echo '${{ inputs.script }}'
                echo 'SCRIPT_EOF'
              } >> "$GITHUB_OUTPUT"
            else
              # Fall back to script file
              {
                echo 'script<<SCRIPT_EOF'
                cat .github/quick-test-script.sh
                echo 'SCRIPT_EOF'
              } >> "$GITHUB_OUTPUT"
            fi
          else
            # Push-triggered: read from config file + script file
            echo "runner=$(jq -r '.runner' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            echo "install_wif_bunker=$(jq -r '.install_wif_bunker' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            echo "setup_tpm=$(jq -r '.setup_tpm' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            {
              echo 'script<<SCRIPT_EOF'
              cat .github/quick-test-script.sh
              echo 'SCRIPT_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

          echo "=== Config ==="
          echo "Runner: $(jq -r '.runner' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.runner }}')"
          echo "Install: $(jq -r '.install_wif_bunker' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.install_wif_bunker }}')"
          echo "TPM Setup: $(jq -r '.setup_tpm' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.setup_tpm }}')"
          echo ""
          echo "=== Script ==="
          cat .github/quick-test-script.sh 2>/dev/null || echo "(using dispatch input)"

  quick-test:
    name: "Quick Test (${{ needs.config.outputs.runner }})"
    needs: config
    runs-on: >-
      ${{
        needs.config.outputs.runner == 'hardware-tpm' && fromJSON('["self-hosted", "Linux", "X64", "tpm"]') ||
        needs.config.outputs.runner == 'yubikey'      && fromJSON('["self-hosted", "Linux", "X64", "yk"]') ||
        needs.config.outputs.runner
      }}
    environment: >-
      ${{
        (needs.config.outputs.runner == 'hardware-tpm' || needs.config.outputs.runner == 'yubikey') && 'tpm-hardware' || ''
      }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Paths to pre-built OpenSSL + Python (from build-python-ssl.yml cache)
      OPENSSL_INSTALL_PATH: ${{ github.workspace }}/bin/ssl
      PYTHON_INSTALL_PATH: ${{ github.workspace }}/bin/python
      # Force Python to use UTF-8 for stdout/stderr on Windows (default is cp1252)
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── GCP Auth ──
      - id: auth
        if: needs.config.outputs.install_wif_bunker == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - if: >-
          needs.config.outputs.install_wif_bunker == 'true' &&
          needs.config.outputs.runner != 'hardware-tpm' &&
          needs.config.outputs.runner != 'yubikey'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ══════════════════════════════════════════════════════════════════════
      # Restore pre-built OpenSSL + Python from cache
      # Built daily by build-python-ssl.yml — restore-keys prefix match
      # falls back to the most recent successful build.
      # ══════════════════════════════════════════════════════════════════════

      - name: "Restore compiled OpenSSL + Python"
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-python-ssl
        with:
          path: |
            bin/ssl
            bin/python
          key: python-ssl-${{ runner.os }}-${{ runner.arch }}-v2-
          restore-keys: |
            python-ssl-${{ runner.os }}-${{ runner.arch }}-v2-
          fail-on-cache-miss: true

      - name: "Set PYTHON env var and library paths"
        shell: bash
        run: |
          # Set the exact path to our compiled Python binary.
          # On Windows, CPython installs as python.exe (no python3 symlink).
          # Using $PYTHON everywhere avoids picking up a system Python.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PYTHON="${PYTHON_INSTALL_PATH}/python.exe"
            echo "${PYTHON_INSTALL_PATH}" >> "$GITHUB_PATH"
            echo "${PYTHON_INSTALL_PATH}/Scripts" >> "$GITHUB_PATH"
          else
            export PYTHON="${PYTHON_INSTALL_PATH}/bin/python3"
            echo "${PYTHON_INSTALL_PATH}/bin" >> "$GITHUB_PATH"
          fi

          # Library search paths — set for ALL OSes so our compiled OpenSSL
          # is always found before any system copy.
          export LD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${PYTHON_INSTALL_PATH}/lib:${OPENSSL_INSTALL_PATH}/lib:${DYLD_LIBRARY_PATH}"
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV
          fi

          echo "PYTHON=${PYTHON}" >> $GITHUB_ENV
          echo "Compiled Python binary: ${PYTHON}"
          ls -la "${PYTHON}" 2>/dev/null || echo "WARNING: ${PYTHON} does not exist!"
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"

      - name: "Verify compiled Python + OpenSSL"
        shell: bash
        run: |
          echo "PYTHON=${PYTHON}"
          "${PYTHON}" --version
          "${PYTHON}" -c "import ssl; print(f'Python ssl module OpenSSL: {ssl.OPENSSL_VERSION}')"

      # ── Install wif-bunker ──
      - name: "Install wif-bunker"
        if: needs.config.outputs.install_wif_bunker == 'true'
        shell: bash
        run: |
          "${PYTHON}" -m venv .venv
          source .venv/bin/activate || . .venv/Scripts/activate 2>/dev/null
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          pip install --upgrade pip
          pip install .

      # ── Build hardmTLS ──
      - name: "Install Rust toolchain"
        if: needs.config.outputs.install_wif_bunker == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: "Windows: Configure MSVC for hardmTLS"
        if: needs.config.outputs.install_wif_bunker == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch }}

      - name: "Windows: Hide Git link.exe (shadows MSVC)"
        if: needs.config.outputs.install_wif_bunker == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          GIT_LINK="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$GIT_LINK" ]; then
            mv "$GIT_LINK" "${GIT_LINK}.bak"
            echo "Renamed Git link.exe to avoid MSVC collision"
          fi

      - name: "Build hardmTLS"
        if: needs.config.outputs.install_wif_bunker == 'true'
        shell: bash
        env:
          OPENSSL_DIR: ${{ github.workspace }}/bin/ssl
        run: |
          cd hardmtls-native
          cargo build --release
          echo "hardmTLS library built:"
          ls -la target/release/libhardmtls* target/release/hardmtls* 2>/dev/null || true

      # ── TPM Reset (hardware-tpm only) ──
      - name: "Reset TPM to clean state"
        if: needs.config.outputs.setup_tpm == 'true' && needs.config.outputs.runner == 'hardware-tpm'
        shell: bash
        run: |
          echo "=== TPM Info ==="
          tpm2_getcap properties-fixed 2>/dev/null | head -20 || echo "(tpm2_getcap failed)"

          echo ""
          echo "=== Evicting persistent handles ==="
          HANDLES=$(tpm2_getcap handles-persistent 2>/dev/null | grep -oP '0x[0-9A-Fa-f]+' || true)
          for h in $HANDLES; do
            echo "  Evicting $h"
            tpm2_evictcontrol -c "$h" 2>/dev/null || true
          done
          [ -n "$HANDLES" ] && echo "Evicted $(echo "$HANDLES" | wc -w) handle(s)." || echo "No stale handles."

          echo ""
          echo "=== Resetting PKCS#11 store ==="
          rm -rf "$HOME/.tpm2_pkcs11"
          mkdir -p "$HOME/.tpm2_pkcs11"
          export TPM2_PKCS11_STORE="$HOME/.tpm2_pkcs11"

          echo ""
          echo "=== Bootstrap DB via C library ==="
          pkcs11-tool --module /usr/lib/x86_64-linux-gnu/pkcs11/libtpm2_pkcs11.so -T 2>&1 || true

          echo ""
          echo "=== Initialize tpm2-pkcs11 store (token created by WIF Bunker) ==="
          if command -v tpm2_ptool &>/dev/null; then
            tpm2_ptool init --path="$HOME/.tpm2_pkcs11" 2>/dev/null || true
            echo "Initialized fresh tpm2-pkcs11 store."
          fi

          echo ""
          echo "=== Verify PKCS#11 store ==="
          ls -la "$HOME/.tpm2_pkcs11/"

      # ── Diagnostics: dump environment ──
      - name: "Environment dump"
        shell: bash
        run: |
          echo "=== System ==="
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "User: $(whoami)"
          echo ""

          echo "=== Python ==="
          which "${PYTHON}" && "${PYTHON}" --version
          which pip && pip --version 2>/dev/null || true
          echo ""

          if command -v tpm2_getcap &>/dev/null; then
            echo "=== TPM ==="
            tpm2_getcap properties-fixed 2>/dev/null | grep -E "(TPM2_PT_MANUFACTURER|TPM2_PT_FIRMWARE)" || true
            echo ""
            echo "=== TPM Persistent Handles ==="
            tpm2_getcap handles-persistent 2>/dev/null || echo "(none)"
            echo ""
            echo "=== PKCS#11 Store ==="
            echo "TPM2_PKCS11_STORE=${TPM2_PKCS11_STORE:-'(not set)'}"
            ls -la "$HOME/.tpm2_pkcs11/" 2>/dev/null || echo "(not found)"
            echo ""
            echo "=== PKCS#11 Tokens ==="
            pkcs11-tool --module /usr/lib/x86_64-linux-gnu/pkcs11/libtpm2_pkcs11.so -T 2>&1 || true
          fi

      # ── Run the script ──
      - name: "Run script"
        shell: bash
        run: |
          # Activate venv if it exists
          if [ -d ".venv" ]; then
            source .venv/bin/activate || . .venv/Scripts/activate 2>/dev/null
          fi
          # Set TPM env for self-hosted
          if command -v tpm2_getcap &>/dev/null; then
            export TPM2_PKCS11_STORE="$HOME/.tpm2_pkcs11"
          fi

          ${{ needs.config.outputs.script }}

      # ── Post-run diagnostics ──
      - name: "Post-run diagnostics"
        if: always()
        shell: bash
        run: |
          echo "=== Generated files ==="
          find . -maxdepth 2 -name "*.pem" -o -name "*.json" -o -name "*.log" 2>/dev/null | sort || true

          if command -v tpm2_getcap &>/dev/null; then
            echo ""
            echo "=== TPM Persistent Handles (post-run) ==="
            tpm2_getcap handles-persistent 2>/dev/null || echo "(none)"
            echo ""
            echo "=== PKCS#11 Store (post-run) ==="
            ls -la "$HOME/.tpm2_pkcs11/" 2>/dev/null || echo "(not found)"
          fi

          if [ -f "adc.json" ]; then
            echo ""
            echo "=== adc.json (post-run) ==="
            cat adc.json
          fi

      # ── Cleanup (self-hosted only) ──
      - name: "Cleanup"
        if: always() && (needs.config.outputs.runner == 'hardware-tpm' || needs.config.outputs.runner == 'yubikey')
        shell: bash
        run: |
          HANDLES=$(tpm2_getcap handles-persistent 2>/dev/null | grep -oP '0x[0-9A-Fa-f]+' || true)
          for h in $HANDLES; do tpm2_evictcontrol -c "$h" 2>/dev/null || true; done
          rm -rf "$HOME/.tpm2_pkcs11"
          rm -f adc.json bunker-workload-*.pem
