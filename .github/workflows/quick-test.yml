name: Quick Test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to target'
        required: true
        type: choice
        options:
          - 'hardware-tpm'
          - 'yubikey'
          - 'ubuntu-24.04'
          - 'ubuntu-26.04'
          - 'macos-15'
          - 'windows-2025-vs2026'
      script:
        description: 'Bash script to run (overrides quick-test-script.sh)'
        required: false
        type: string
      install_wif_bunker:
        description: 'Install wif-bunker and dependencies into a venv'
        required: false
        type: boolean
        default: true
      setup_tpm:
        description: 'Reset TPM to clean state (hardware-tpm only)'
        required: false
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/quick-test-config.json'
      - '.github/quick-test-script.sh'

permissions:
  contents: read
  id-token: write

jobs:
  # ── Read config from file (push-triggered) or inputs (dispatch) ──
  config:
    name: "Load config"
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runner }}
      install_wif_bunker: ${{ steps.cfg.outputs.install_wif_bunker }}
      setup_tpm: ${{ steps.cfg.outputs.setup_tpm }}
      script: ${{ steps.cfg.outputs.script }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Parse config"
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "runner=${{ inputs.runner }}" >> "$GITHUB_OUTPUT"
            echo "install_wif_bunker=${{ inputs.install_wif_bunker }}" >> "$GITHUB_OUTPUT"
            echo "setup_tpm=${{ inputs.setup_tpm }}" >> "$GITHUB_OUTPUT"
            if [ -n "${{ inputs.script }}" ]; then
              # Use dispatch script input
              {
                echo 'script<<SCRIPT_EOF'
                echo '${{ inputs.script }}'
                echo 'SCRIPT_EOF'
              } >> "$GITHUB_OUTPUT"
            else
              # Fall back to script file
              {
                echo 'script<<SCRIPT_EOF'
                cat .github/quick-test-script.sh
                echo 'SCRIPT_EOF'
              } >> "$GITHUB_OUTPUT"
            fi
          else
            # Push-triggered: read from config file + script file
            echo "runner=$(jq -r '.runner' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            echo "install_wif_bunker=$(jq -r '.install_wif_bunker' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            echo "setup_tpm=$(jq -r '.setup_tpm' .github/quick-test-config.json)" >> "$GITHUB_OUTPUT"
            {
              echo 'script<<SCRIPT_EOF'
              cat .github/quick-test-script.sh
              echo 'SCRIPT_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

          echo "=== Config ==="
          echo "Runner: $(jq -r '.runner' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.runner }}')"
          echo "Install: $(jq -r '.install_wif_bunker' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.install_wif_bunker }}')"
          echo "TPM Setup: $(jq -r '.setup_tpm' .github/quick-test-config.json 2>/dev/null || echo '${{ inputs.setup_tpm }}')"
          echo ""
          echo "=== Script ==="
          cat .github/quick-test-script.sh 2>/dev/null || echo "(using dispatch input)"

  quick-test:
    name: "Quick Test (${{ needs.config.outputs.runner }})"
    needs: config
    runs-on: >-
      ${{
        needs.config.outputs.runner == 'hardware-tpm' && fromJSON('["self-hosted", "Linux", "X64", "tpm"]') ||
        needs.config.outputs.runner == 'yubikey'      && fromJSON('["self-hosted", "Linux", "X64", "yk"]') ||
        needs.config.outputs.runner
      }}
    environment: >-
      ${{
        (needs.config.outputs.runner == 'hardware-tpm' || needs.config.outputs.runner == 'yubikey') && 'tpm-hardware' || ''
      }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Force Python to use UTF-8 for stdout/stderr on Windows (default is cp1252)
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── GCP Auth ──
      - id: auth
        if: needs.config.outputs.install_wif_bunker == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - if: >-
          needs.config.outputs.install_wif_bunker == 'true' &&
          needs.config.outputs.runner != 'hardware-tpm' &&
          needs.config.outputs.runner != 'yubikey'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Set up latest Python and OpenSSL
        id: setup-python-ssl
        uses: jay0lee/python-openssl-latest@v1

      # ── System libs (Linux) ──
      - name: "Install system dependencies (Linux)"
        if: needs.config.outputs.install_wif_bunker == 'true' && runner.os == 'Linux' && needs.config.outputs.runner != 'hardware-tpm' && needs.config.outputs.runner != 'yubikey'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev libtss2-dev swig pkg-config

      # ── Install wif-bunker ──
      - name: "Install wif-bunker"
        if: needs.config.outputs.install_wif_bunker == 'true'
        shell: bash
        run: |
          "${PYTHON}" -m venv .venv
          if [ -d ".venv/Scripts" ]; then
            source .venv/Scripts/activate
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            source .venv/bin/activate
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export CFLAGS="-std=c11 ${CFLAGS:-}"
          elif [[ "${RUNNER_OS}" == "Windows" ]]; then
            git config --global core.longpaths true
          fi
          pip install --upgrade pip
          pip install .

      # ── TPM Reset (hardware-tpm only) ──
      - name: "Reset TPM to clean state"
        if: needs.config.outputs.setup_tpm == 'true' && needs.config.outputs.runner == 'hardware-tpm'
        shell: bash
        run: |
          echo "=== TPM Info ==="
          tpm2_getcap properties-fixed | head -20

          echo ""
          echo "=== Flushing transient contexts ==="
          tpm2_flushcontext --transient-object
          tpm2_flushcontext --loaded-session
          tpm2_flushcontext --saved-session

          echo ""
          echo "=== Evicting persistent handles ==="
          HANDLES=$(tpm2_getcap handles-persistent | grep -oP '0x[0-9A-Fa-f]+' || true)
          for h in $HANDLES; do
            echo "  Evicting $h"
            tpm2_evictcontrol -c "$h"
          done
          [ -n "$HANDLES" ] && echo "Evicted $(echo "$HANDLES" | wc -w) handle(s)." || echo "No stale handles."

      # ── Diagnostics: dump environment ──
      - name: "Environment dump"
        shell: bash
        run: |
          echo "=== System ==="
          echo "Hostname: $(hostname)"
          echo "OS: $(uname -a)"
          echo "User: $(whoami)"
          echo ""

          echo "=== Python ==="
          which "${PYTHON}" && "${PYTHON}" --version
          which pip && pip --version 2>/dev/null || true
          echo ""

          if command -v tpm2_getcap &>/dev/null; then
            echo "=== TPM ==="
            tpm2_getcap properties-fixed | grep -E "(TPM2_PT_MANUFACTURER|TPM2_PT_FIRMWARE)" || true
            echo ""
            echo "=== TPM Persistent Handles ==="
            tpm2_getcap handles-persistent || echo "(none)"
          fi

      # ── Run the script ──
      - name: "Run script"
        shell: bash
        run: |
          if [ -d ".venv" ]; then
            source .venv/bin/activate || . .venv/Scripts/activate 2>/dev/null
          fi

          ${{ needs.config.outputs.script }}

      # ── Post-run diagnostics ──
      - name: "Post-run diagnostics"
        if: always()
        shell: bash
        run: |
          echo "=== Generated files ==="
          find . -maxdepth 2 \( -name "*.pem" -o -name "*.json" -o -name "*.log" \) | sort || true

          if command -v tpm2_getcap &>/dev/null; then
            echo ""
            echo "=== TPM Persistent Handles (post-run) ==="
            tpm2_getcap handles-persistent || echo "(none)"
          fi

          if [ -f "bunker.json" ]; then
            echo ""
            echo "=== bunker.json (post-run) ==="
            cat bunker.json
          fi

          if [ -f "adc.json" ]; then
            echo ""
            echo "=== adc.json (post-run) ==="
            cat adc.json
          fi

      # ── Cleanup (self-hosted only) ──
      - name: "Cleanup"
        if: always() && (needs.config.outputs.runner == 'hardware-tpm' || needs.config.outputs.runner == 'yubikey')
        shell: bash
        run: |
          if [ "${{ needs.config.outputs.runner }}" = "hardware-tpm" ]; then
            HANDLES=$(tpm2_getcap handles-persistent | grep -oP '0x[0-9A-Fa-f]+' || true)
            for h in $HANDLES; do tpm2_evictcontrol -c "$h"; done
          fi
          rm -f adc.json bunker.json
