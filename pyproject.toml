[project]
name = "wif-bunker"
version = "0.1.0"
description = "Hardware-backed Workload Identity Federation for Google Cloud"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "google-auth @ https://github.com/jay0lee/google-cloud-python/releases/download/google-auth-v2.56.2-bunker3/google_auth-2.56.2+bunker3-py3-none-any.whl",
]

[project.scripts]
wif-bunker = "wif_bunker:main"
