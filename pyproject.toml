[project]
name = "wif-bunker"
version = "0.1.0"
description = "Hardware-backed Workload Identity Federation for Google Cloud"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cffi>=2.0.0",
    "cryptography>=44.0",
    "pyOpenSSL>=24.0",
    "google-auth @ https://github.com/jay0lee/google-cloud-python/releases/download/google-auth-v2.56.2-bunker5/google_auth-2.56.2+bunker5-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]
yubikey = [
    "yubikey-manager>=5.0",
]

[tool.setuptools]
packages = ["wif_bunker", "wif_bunker.keystore", "wif_bunker.attestation"]

[tool.setuptools.package-data]
"wif_bunker.attestation" = ["roots/**/*.pem"]

[project.scripts]
wif-bunker = "wif_bunker:main"

# ── Ruff ──
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM105", # contextlib.suppress (try/except/pass with comments is clearer)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["wif_bunker", "get_ecp"]

# ── PyTest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires GCP credentials and/or hardware",
]
addopts = "-v --tb=short -m 'not integration'"

# ── Coverage ──
[tool.coverage.run]
source = ["wif_bunker", "get_ecp"]

[tool.coverage.report]
show_missing = true
fail_under = 50
