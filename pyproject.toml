[project]
name = "wif-bunker"
version = "0.1.0"
description = "Hardware-backed Workload Identity Federation for Google Cloud"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "cffi>=2.0.0",
    "cryptography>=44.0",
    "pyOpenSSL>=24.0",
    "python-pkcs11>=0.7",
    # Pin to upstream 3.0.0-rc1 (d462fb4): PyPI v2.3.0 fails to build on
    # GCC 15 / C23 (Ubuntu 26.04) due to pycparser header incompatibilities.
    # Upstream master has the fix but no release yet.  Track:
    # https://github.com/tpm2-software/tpm2-pytss/issues/639
    "tpm2-pytss @ git+https://github.com/tpm2-software/tpm2-pytss.git@d462fb475e313074a07badab50e67f2944182f36 ; sys_platform == 'linux'",
    "yubikey-manager>=5.0",
    "google-auth @ https://github.com/jay0lee/google-cloud-python/releases/download/google-auth-v2.56.2-bunker4/google_auth-2.56.2+bunker4-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
packages = ["wif_bunker", "wif_bunker.keystore", "wif_bunker.attestation"]

[tool.setuptools.package-data]
"wif_bunker.attestation" = ["roots/**/*.pem"]

[project.scripts]
wif-bunker = "wif_bunker:main"

# ── Ruff ──
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    "bin",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM105", # contextlib.suppress (try/except/pass with comments is clearer)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["wif_bunker", "get_ecp"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SIM117", "RUF043", "RUF059"]

# ── PyTest ──
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires GCP credentials and/or hardware",
]
addopts = "-v --tb=short -m 'not integration'"

# ── Coverage ──
[tool.coverage.run]
source = ["wif_bunker"]

[tool.coverage.report]
show_missing = true
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def _oauth_user_token",
]
exclude_also = [
    "if __name__ == .__main__.",
]
