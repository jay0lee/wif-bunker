[package]
name = "hardmtls"
version = "0.1.0"
edition = "2021"
description = "Hardware-backed mTLS signing library — drop-in replacement for Google ECP"
license = "Apache-2.0"
# NOTE: This crate is designed to be detachable from wif-bunker.
# Keep it self-contained. If we spin it out to a standalone library
# (e.g., `cargo install hardmtls`), the separation should be straightforward.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Config parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# OpenSSL FFI (dynamically links against system OpenSSL — same one Python uses)
openssl = "0.10"
openssl-sys = "0.9"

# PKCS#11 FFI (cross-platform: Linux, macOS, Windows)
cryptoki = "0.7.0"

# Error handling
thiserror = "2"
foreign-types-shared = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# NCrypt/CNG FFI for Windows TPM
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS Security.framework FFI for Secure Enclave + Keychain
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow these where justified — keep the list minimal
module_name_repetitions = "allow"
missing_errors_doc = "allow"
